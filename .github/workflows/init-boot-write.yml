name: Init boot write payload
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
      - run: python -m pip install -r requirements.txt unicorn==2.1.4
      - run: make -C payload/init_boot_write CC=aarch64-linux-gnu-gcc LD=aarch64-linux-gnu-gcc OBJCOPY=aarch64-linux-gnu-objcopy
      - run: python -m unittest discover -s tests -v
